<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Naveed Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #06233f, #087de8);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);

            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #06233f;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;

            margin-top: 15px;

            background: #087de8;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #06233f;
        }

        #message {
            margin-top: 15px;
            color: red;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #087de8;
            text-decoration: none;
        }

    </style>

</head>

<body>


    <div class="login-box">

        <div class="logo">
            🛒 Naveed Store
        </div>

        <h2>Admin Login</h2>


        <input
            type="text"
            id="username"
            placeholder="Enter Admin Username"
        >


        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >


        <button onclick="login()">
            🔐 Login
        </button>


        <p id="message"></p>


        <a href="index.html" class="back">
            ← Back to Store
        </a>

    </div>


    <script>

        function login() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;


            if (username === "admin" && password === "12345") {

                window.location.href = "admin.html";

            } else {

                document.getElementById("message").innerText =
                    "❌ Incorrect username or password";

            }

        }

    </script>


</body>

</html>
