 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Naveed Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        🛒 Naveed Store
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart 🛒</a>
    </nav>

</header>


<section class="cart-page">

    <h1>🛒 Shopping Cart</h1>

    <div id="cartItems"></div>

    <div class="cart-summary">

        <h2>Order Summary</h2>

        <p>
            Subtotal:
            <strong id="subtotal">Rs. 0</strong>
        </p>

        <p>
            Delivery:
            <strong>Rs. 200</strong>
        </p>

        <hr>

        <h3>
            Total:
            <strong id="grandTotal">Rs. 0</strong>
        </h3>

        <button class="checkout" onclick="checkout()">
            Proceed to Checkout →
        </button>

    </div>

</section>


<footer>

    <h3>🛒 Naveed Store</h3>

    <p>© 2026 Naveed Store. All Rights Reserved.</p>

</footer>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart() {

    let cartItems = document.getElementById("cartItems");

    if (cart.length === 0) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                <h2>🛒 Your Cart is Empty</h2>
                <p>Please add some products.</p>
                <br>
                <a href="products.html">
                    <button>Continue Shopping</button>
                </a>
            </div>
        `;

        document.getElementById("subtotal").innerText = "Rs. 0";
        document.getElementById("grandTotal").innerText = "Rs. 0";

        return;
    }


    let html = "";
    let subtotal = 0;


    cart.forEach((product, index) => {

        let productTotal = product.price * product.quantity;

        subtotal += productTotal;

        html += `
            <div class="cart-item">

                <div class="cart-image">
                    🛍️
                </div>

                <div class="cart-info">

                    <h3>${product.name}</h3>

                    <p>
                        Price: Rs. ${product.price.toLocaleString()}
                    </p>

                    <div class="quantity">

                        <button onclick="decrease(${index})">
                            −
                        </button>

                        <span>
                            ${product.quantity}
                        </span>

                        <button onclick="increase(${index})">
                            +
                        </button>

                    </div>

                </div>


                <div class="cart-price">

                    <strong>
                        Rs. ${productTotal.toLocaleString()}
                    </strong>

                    <br><br>

                    <button
                        class="remove"
                        onclick="removeItem(${index})">
                        Remove
                    </button>

                </div>

            </div>
        `;
    });


    cartItems.innerHTML = html;

    document.getElementById("subtotal").innerText =
        "Rs. " + subtotal.toLocaleString();

    document.getElementById("grandTotal").innerText =
        "Rs. " + (subtotal + 200).toLocaleString();
}


function increase(index) {

    cart[index].quantity++;

    saveCart();
}


function decrease(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

        saveCart();
    }
}


function removeItem(index) {

    cart.splice(index, 1);

    saveCart();
}


function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();
}


function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }

    alert("Checkout page coming soon! 🛒");
}


displayCart();

</script>

</body>
</html>
